    <!-- GitHub Pages Single Page Apps: Trailing slash normalization for repo URLs -->
    <script type="text/javascript">
      (function() {
        var l = window.location;
        if (l.hostname.indexOf('github.io') !== -1) {
          var segments = l.pathname.split('/').filter(Boolean);
          // If accessing repo root without trailing slash (e.g. /my-repo), redirect with trailing slash to ensure relative paths resolve
          if (segments.length === 1 && !l.pathname.endsWith('/')) {
            l.replace(l.protocol + '//' + l.host + l.pathname + '/' + l.search + l.hash);
          }
        }
      })();
    </script>

    <!-- GitHub Pages Single Page Apps: 404 query redirect decoder (MIT License rafgraph/spa-github-pages) -->
    <script type="text/javascript">
      (function() {
        var l = window.location;
        if (l.search && l.search.startsWith('?/')) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          var basePath = l.pathname.endsWith('/') ? l.pathname.slice(0, -1) : l.pathname;
          window.history.replaceState(null, null, basePath + decoded + l.hash);
        }
      })();
    </script>
