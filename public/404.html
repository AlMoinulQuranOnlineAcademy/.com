<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Al Muinul Quran Online Academy</title>
    <script type="text/javascript">
      // Robust GitHub Pages Single Page App Redirector
      // Supports both project repos (https://user.github.io/repo/...) and custom domains / user pages (https://domain.com/...)
      (function() {
        var l = window.location;
        var segments = l.pathname.split('/').filter(Boolean);
        var knownRoutes = ['bn', 'en', 'about', 'courses', 'teachers', 'free-trial', 'admission', 'contact'];
        
        // If on github.io and first segment is the repo name (not an app route), keep 1 segment
        var isProjectRepo = (l.hostname.indexOf('github.io') !== -1) && segments.length > 0 && (knownRoutes.indexOf(segments[0].toLowerCase()) === -1);
        var pathSegmentsToKeep = isProjectRepo ? 1 : 0;

        var repoPrefix = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
        var appPath = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~');
        var query = l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '';

        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          repoPrefix + '/?/' + appPath + query + l.hash
        );
      })();
    </script>
  </head>
  <body style="background-color: #F3F5F2; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; color: #123D32;">
    <p>Redirecting to Al Muinul Quran Online Academy...</p>
  </body>
</html>
